version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.1.9gb
      args:
        - NODE_OPTIONS=--max-old-space-size=768
        - BUN_OPTIONS=--max-old-space-size=768
    environment:
      - NODE_OPTIONS=--max-old-space-size=768 --max-semi-space-size=32
      - BUN_OPTIONS=--max-old-space-size=768
      - NODE_GC_INTERVAL=50
      - NODE_GC_OLD_SPACE_SIZE=768
      - NODE_GC_NEW_SPACE_SIZE=64
    deploy:
      resources:
        limits:
          memory: 1500M
        reservations:
          memory: 1G
    shm_size: 512m
