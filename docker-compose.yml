services:
  lms-admin-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-admin-panel
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Update these URLs for your production environment
      - NEXT_PUBLIC_API_BASE_URL=http://79.132.131.161:3001/api/v1
      - NEXT_PUBLIC_APP_URL=http://79.132.131.161:3002
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
