services:
  lms-admin-panel:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: lms-admin-panel
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_BASE_URL=http://79.132.131.161:3001/api/v1
      - NEXT_PUBLIC_APP_URL=http://79.132.131.161:3002
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
