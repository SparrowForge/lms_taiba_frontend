services:
  lms-admin-panel-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps # Stop at dependencies stage for dev
    container_name: lms-admin-panel-dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: bun run dev
